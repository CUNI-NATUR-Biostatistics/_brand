project:
  type: website
  output-dir: docs
  pre-render:
    - Rscript R/generate_theme_brand.R

website:
  title: "Biostatistika — Brand Guidelines"
  favicon: assets/logo/biostatistika-icon.svg
  navbar:
    logo: assets/logo/biostatistika-icon-reversed.svg
    logo-alt: "Biostatistika course logo"
    left:
      - href: brand_guidelines.qmd
        text: Guidelines
  page-footer:
    left: "© 2026 CUNI-NATUR-Biostatistics"
    right:
      - icon: github
        href: https://github.com/CUNI-NATUR-Biostatistics/_brand

format:
  html:
    toc: true
    toc-depth: 2
    toc-title: "Contents"
    number-sections: true
    embed-resources: false
    theme:
      - flatly
      - theme/brand_theme.scss
      - assets/logo/logo-site.scss
    highlight-style: github
    include-in-header: "theme/fonts-include.html"
